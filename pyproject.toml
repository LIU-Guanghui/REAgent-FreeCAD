[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "REAgentFreeCAD"
version = "0.0.1"
description = "An isolated MCP agent for feature-by-feature STEP reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anyio>=4.5,<5",
    "mcp>=1.28.1,<2",
]

[project.scripts]
REAgentFreeCAD = "REAgentFreeCAD.bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["src/REAgentFreeCAD"]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills/reagentfreecad" = "REAgentFreeCAD/knowledge_assets/.agents/skills/reagentfreecad"
"addon/REAgent/protocol/contract.py" = "REAgentFreeCAD/knowledge_assets/contract.py"

[tool.hatch.build.targets.sdist]
include = [
    "/.agents/skills/reagentfreecad",
    "/addon/REAgent",
    "/src/REAgentFreeCAD",
    "/LICENSE",
    "/README.md",
    "/docs/README.zh-CN.md",
    "/pyproject.toml",
    "/uv.lock",
]
